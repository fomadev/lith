name: Build and Package LITH

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            archive: lith-linux-x64.tar.gz
          - os: macos-latest
            name: macOS
            archive: lith-macos.tar.gz
          - os: windows-latest
            name: Windows
            archive: lith-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make zip

      - name: Compile (Linux)
        if: runner.os == 'Linux'
        run: make STATIC=1 && make test

      - name: Compile (macOS)
        if: runner.os == 'macOS'
        run: make CC=clang && make test CC=clang

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make STATIC=1 && make test

      - name: Assemble package
        shell: bash
        run: |
          mkdir -p dist/lith/bin dist/lith/public
          cp bin/lith* dist/lith/bin/ && rm -f dist/lith/bin/unit_tests*
          cp public/index.html dist/lith/public/
          cp lith.conf README.md DOCUMENTATION.md CHANGELOG.md LICENSE dist/lith/

      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C dist lith

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cd dist && zip -qr ../${{ matrix.archive }} lith

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-package
          path: ${{ matrix.archive }}
          retention-days: 7
