name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-assets:
    name: Release ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            ext: tar.gz
          - os: macos-latest
            name: macos
            ext: tar.gz
          - os: windows-latest
            name: windows-x64
            ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make zip

      - name: Compile (Linux)
        if: runner.os == 'Linux'
        run: make STATIC=1 && make test

      - name: Compile (macOS)
        if: runner.os == 'macOS'
        run: make CC=clang && make test CC=clang

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make STATIC=1 && make test

      - name: Assemble package
        id: pkg
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NAME="lith-${TAG}-${{ matrix.name }}"
          mkdir -p "dist/$NAME/bin" "dist/$NAME/public"
          cp bin/lith* "dist/$NAME/bin/" && rm -f "dist/$NAME/bin/unit_tests"*
          cp public/index.html "dist/$NAME/public/"
          cp lith.conf README.md DOCUMENTATION.md CHANGELOG.md LICENSE "dist/$NAME/"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ steps.pkg.outputs.name }}.tar.gz -C dist ${{ steps.pkg.outputs.name }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cd dist && zip -qr ../${{ steps.pkg.outputs.name }}.zip ${{ steps.pkg.outputs.name }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lith-*.zip
            lith-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
