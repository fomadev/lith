name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (unitaires + intégration + sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances de test
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl apache2-utils

      - name: Compilation stricte (-Werror)
        run: make CFLAGS="-O2 -Werror"

      - name: Tests unitaires
        run: make test

      - name: Tests d'intégration
        run: make integration

      - name: Tests avec AddressSanitizer / UBSan
        run: |
          make clean
          make DEBUG=1
          make test DEBUG=1
          LITH_TEST_PORT=18190 bash tests/integration.sh

  macos:
    name: macOS (unitaires + intégration)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilation
        run: make CC=clang CFLAGS="-O2 -Werror"
      - name: Tests unitaires
        run: make test CC=clang
      - name: Tests d'intégration
        run: |
          brew install coreutils >/dev/null 2>&1 || true
          export PATH="$(brew --prefix)/opt/coreutils/libexec/gnubin:$PATH"
          make integration CC=clang

  windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make curl
      - name: Compilation
        run: make CFLAGS="-O2 -Werror"
      - name: Tests unitaires
        run: make test
      - name: Tests d'intégration
        run: make integration

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t lith:ci .
      - name: Démarrage et vérification
        run: |
          docker run -d --name lith -p 8090:8090 lith:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8090/__lith/health && break; sleep 0.5; done
          curl -fs http://127.0.0.1:8090/ | grep -qi "LITH"
          docker exec lith /lith health
          docker image ls lith:ci
          docker rm -f lith
