# ==============================================================
#  LITH 1.0.0 - Fichier de configuration
#  Format : CLE=VALEUR  (une par ligne, '#' = commentaire)
#  Toutes les clés sont optionnelles : la valeur par défaut est
#  indiquée en commentaire. Voir DOCUMENTATION.md, chapitre 5.
# ==============================================================

# --- Réseau ---------------------------------------------------
# Adresse d'écoute (0.0.0.0 = toutes les interfaces IPv4, :: = IPv4+IPv6)
HOST=0.0.0.0
# Port d'écoute
PORT=8090
# Nombre de threads de travail (0 = automatique)
THREADS=0
# Durée (s) pendant laquelle une connexion inactive reste ouverte
KEEPALIVE_TIMEOUT=5
# Temps maximum (s) pour recevoir une requête complète
REQUEST_TIMEOUT=10
# Taille maximum du corps d'une requête (K, M, G acceptés)
MAX_BODY_SIZE=10M

# --- Fichiers -------------------------------------------------
# Dossier contenant le site web
PUBLIC_DIR=public
# Fichier servi quand on demande un dossier
INDEX_FILE=index.html
# Afficher la liste des fichiers d'un dossier sans index.html (0/1)
AUTO_INDEX=0
# Applications monopage (React, Vue...) : renvoyer index.html pour les routes inconnues
SPA_FALLBACK=0
# Cacher les fichiers commençant par un point (.env, .git...)
HIDE_DOTFILES=1

# --- Performance ----------------------------------------------
# Garder les petits fichiers en mémoire vive (rechargés si modifiés)
USE_CACHE=1
CACHE_MAX_SIZE=64M
CACHE_FILE_MAX=2M
# Compression gzip des fichiers texte (HTML, CSS, JS, JSON, SVG...)
GZIP=1

# --- Sécurité -------------------------------------------------
# En-têtes de protection (nosniff, anti-clickjacking, referrer)
SECURITY_HEADERS=1
# Content-Security-Policy (vide = non envoyée)
# CSP=default-src 'self'
# Autoriser les appels depuis un autre site (CORS). Vide = désactivé
# CORS_ORIGIN=*
# Limite de requêtes par seconde et par adresse IP (0 = désactivé)
RATE_LIMIT=0
# Protéger un chemin par mot de passe (répétable)
# AUTH=/admin admin:changez-moi

# --- Proxy inverse ---------------------------------------------
# Transmettre un préfixe d'URL à une autre application (répétable).
# Plusieurs backends = répartition de charge (round-robin).
# PROXY=/api http://127.0.0.1:3000
# PROXY=/app http://127.0.0.1:4000,http://127.0.0.1:4001
PROXY_TIMEOUT=30
HEALTH_CHECK_INTERVAL=5

# --- Développement & supervision -------------------------------
# Recharger automatiquement le navigateur quand un fichier change
LIVE_RELOAD=0
# Pages /__lith/status et /__lith/metrics (accès local uniquement sans STATUS_AUTH)
STATUS=1
# STATUS_AUTH=admin:changez-moi

# --- Journaux ---------------------------------------------------
# Niveau : debug, info, warn, error
LOG_LEVEL=info
# Fichier de journal (vide = console)
# LOG_FILE=lith.log
# Une ligne par requête reçue
ACCESS_LOG=1
# Fichier PID du mode démon (Linux/macOS)
PID_FILE=lith.pid
